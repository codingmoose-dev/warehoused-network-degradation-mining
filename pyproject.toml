[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warehoused-network-degradation-mining"
version = "0.1.0"
description = "Warehouse-guided mining and modeling of network service degradation patterns."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0 for source code; CC-BY-4.0 for documentation, figures, and generated result tables" }
authors = [
    { name = "Mohammed Mostafa" },
]
keywords = [
    "data-warehousing",
    "network-service-degradation",
    "data-mining",
    "graph-mining",
    "qos",
    "qoe",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "matplotlib",
    "mlxtend",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "xgboost",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
gnn = [
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "scripts", "tests"]
extend-exclude = [
    ".venv",
    "__pycache__",
    "data",
    "figures",
    "results",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["network_degradation_mining"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"